name: Deploy CloudBase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase
        run: |
          tcb login \
            --cloudbase-api-key "${{ secrets.TCB_API_KEY }}" \
            -e "${{ secrets.TCB_ENV_ID }}"

      - name: Deploy
        run: |
          tcb hosting deploy ./dist \
            -e "${{ secrets.TCB_ENV_ID }}" \
            --prune